name: Dependency security
on:
  push:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

defaults:
  run:
    shell: bash

# Scheduled workflows are discovered on main. Also scan the branch used by
# the deployed aster-idp fork; pushes and manual runs scan their exact commit.
jobs:
  dependencies:
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(forgejo.event_name == 'schedule' && '["main","upgrade/ferriskey-v0.10.2"]' || '[""]') }}
    runs-on: aster-forge-linux-x64
    container:
      image: forge.emrul.dev/aster/aster-ci@sha256:19dd34dab5631751b67b2a5eee8a6282b3b3d529edcfe6da217f5d7fa86535bf
    timeout-minutes: 20
    env:
      CARGO_HOME: /cache/cargo
      RUSTC_WRAPPER: ""
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ matrix.ref || forgejo.sha }}
          persist-credentials: false
      - name: Install pinned checker
        run: |
          set -euo pipefail
          if [[ "$(cargo deny --version 2>/dev/null)" != "cargo-deny 0.19.0" ]]; then
            cargo install --locked --version 0.19.0 cargo-deny
          fi
      - name: Check current advisories and dependency policy
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cargo deny fetch db
          cargo deny --locked check
